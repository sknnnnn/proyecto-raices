<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Experiencias — Proyecto Raíces</title>
<!-- Redirección mínima: el catálogo vive en experiencias.html. Esta
     página sólo se conserva para no romper enlaces antiguos; mantiene
     los filtros ?destino= y ?tipo= (los únicos que soportaba). -->
<script>
  (function () {
    var src = new URLSearchParams(window.location.search);
    var dst = new URLSearchParams();
    ["destino", "tipo"].forEach(function (k) { if (src.get(k)) dst.set(k, src.get(k)); });
    var q = dst.toString();
    window.location.replace("experiencias.html" + (q ? "?" + q : "") + window.location.hash);
  })();
</script>
<noscript><meta http-equiv="refresh" content="0; url=experiencias.html"></noscript>
</head>
<body>
<p><a href="experiencias.html">Experiencias / Experiences</a></p>
</body>
</html>
